name: Semantic Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          # Pinned below 10.x: that major switched to a new
          # @conventional-changelog/template-based renderer requiring
          # conventional-changelog-writer@9+, which is newer than what this
          # action's bundled semantic-release core ships -- an unpinned
          # (floating-latest) version here breaks generateNotes with
          # "Missing helper" errors. 9.3.1 is the last release before that
          # switch.
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
