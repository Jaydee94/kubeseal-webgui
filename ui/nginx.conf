# Main nginx configuration for the kubeseal-webgui UI image.
#
# Replaces the base image's /etc/nginx/nginx.conf so the container works as a
# non-root user with a read-only root filesystem: everything nginx writes at
# runtime (PID file, request/proxy buffers) lives under /tmp, which the Helm
# chart mounts as an emptyDir. Logs go straight to stdout/stderr.

worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # request_id is forwarded to the API as X-Request-ID (see default.conf), so
    # a line here can be matched with the API log lines of the same request.
    # rt = total request time, urt = time spent waiting for the API.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time '
                      'request_id=$request_id';

    # The kubelet probes "/" every few seconds; keep those out of the log
    # unless they fail.
    map $http_user_agent $is_probe {
        default         0;
        ~^kube-probe/   1;
    }
    map "$is_probe:$status" $loggable {
        default   1;
        ~^1:[23]  0;
    }

    access_log  /dev/stdout  main  if=$loggable;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Only the project's own server block -- the base image's example
    # conf.d/nginx.default.conf is deliberately not included. Mount a file
    # over /etc/nginx/conf.d/default.conf to change e.g. the API upstream.
    include /etc/nginx/conf.d/default.conf;
}
