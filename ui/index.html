<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!--
    All URLs of the app are relative, so the page must be loaded from a path
    that ends in "/": under https://example.com/kubeseal-webgui they would
    resolve against https://example.com/. The UI's nginx redirects such
    requests itself; this covers an ingress that strips the path prefix, where
    nginx only sees "/".
  -->
  <script>
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('/index.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash)
    }
  </script>
  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  >
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
  >
  <meta
    name="description"
    content="Modern web interface for Bitnami Sealed Secrets - Create and manage Kubernetes sealed secrets with an intuitive, beautiful UI"
  >
  <!-- The blue of the logo; the dark variant is the same hue, darkened to sit on a dark UI. -->
  <meta
    name="theme-color"
    content="#3d89d0"
    media="(prefers-color-scheme: light)"
  >
  <meta
    name="theme-color"
    content="#24527e"
    media="(prefers-color-scheme: dark)"
  >
  <link
    rel="icon"
    type="image/svg+xml"
    href="./favicon.svg"
  >
  <link
    rel="icon"
    href="./favicon.ico"
    sizes="32x32"
  >
  <title>
    Kubeseal WebGui - Sealed Secrets Management
  </title>
</head>

<body>
  <noscript>
    <strong>We're sorry but
      Kubeseal Webgui
        doesn't work properly without JavaScript enabled.
        Please enable it to continue.
    </strong>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
