server {
    listen [::]:8080;
    listen 8080;
    server_name  localhost;

    root   /usr/share/nginx/html;

    # Redirects carry only the path, so they work behind any ingress hostname,
    # port and scheme.
    absolute_redirect off;

    #access_log  /var/log/nginx/host.access.log  main;

    # The UI can be served under a path prefix, e.g.
    # https://example.com/kubeseal-webgui/, whether or not the ingress strips
    # the prefix before the request gets here. The UI only uses relative URLs,
    # so every location below accepts an optional prefix of plain path segments
    # ([A-Za-z0-9._~-]) and ignores it. Nothing has to be configured here for a
    # prefix.

    # The API. Only its endpoints are passed on, without the prefix.
    location ~ "^(?:/[A-Za-z0-9._~-]+)*?/(?<api_path>secrets|namespaces|config|openapi\.json|docs|sealed-secrets/[^/]+)$" {
        rewrite ^ /$api_path break;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Correlates this request with the API logs; always overwritten so a
        # client cannot choose the id.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # The files of the UI build.
    location ~ "^(?:/[A-Za-z0-9._~-]+)*?/(?<static_path>assets/[^/]+|config\.json|favicon\.ico|favicon\.svg|index\.html)$" {
        try_files /$static_path =404;
    }

    # The start page: "/" or the prefix with its trailing slash.
    location ~ "^(?:/[A-Za-z0-9._~-]+)*/$" {
        try_files /index.html =404;
    }

    # The prefix without its trailing slash: relative URLs would resolve
    # against the parent path, so add the slash. Paths the locations above
    # serve are not redirected, which is why the chart rejects prefixes that
    # end like one of them (see "kubeseal-webgui.servedPath" in _helpers.tpl).
    location ~ "^(?:/[A-Za-z0-9._~-]+)*/[A-Za-z0-9._~-]+$" {
        return 301 $uri/$is_args$args;
    }

    location / {
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
