# Logging configuration for local runs and the plain container image.
# The Helm chart ships its own templated copy
# (chart/kubeseal-webgui/files/logging_config.yaml) -- keep both in sync.
version: 1
disable_existing_loggers: False
filters:
  # Adds %(request_id)s, the id shared with the nginx access log and the UI.
  request_id:
    "()": kubeseal_webgui_api.logging_utils.RequestIdFilter
  # Drops successful "GET /" probe requests from the access log.
  health_check:
    "()": kubeseal_webgui_api.logging_utils.HealthCheckAccessFilter
formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  access:
    "()": uvicorn.logging.AccessFormatter
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  # One JSON object per line. To use it, set `formatter: json` on both handlers.
  json:
    "()": kubeseal_webgui_api.logging_utils.JsonFormatter
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
    filters:
      - request_id
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
    filters:
      - request_id
      - health_check
# Third-party libraries (kubernetes client, urllib3, ...) log through the root
# logger. It stays at WARNING on purpose: at DEBUG the kubernetes client dumps
# complete API requests and responses.
root:
  level: WARNING
  handlers:
    - default
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
  kubeseal-webgui:
    level: INFO
    handlers:
      - default
    propagate: no
